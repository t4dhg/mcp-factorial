name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token that authenticates the publish. Without this,
      # trusted publishing cannot work.
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Trusted publishing requires npm >= 11.5.1 and Node >= 22.14.0.
          # Node 24 ships npm 11.x. Node 20 and 22 ship npm 10.x and cannot
          # authenticate over OIDC, which is why publishes here used a token.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # npm's guidance: never cache in release builds.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm run audit

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify published package
        run: npm run check:package -- "$RUNNER_TEMP/factorial-package"

      - name: Install release candidate as a consumer
        run: npm install --prefix "$RUNNER_TEMP/factorial-consumer" "$RUNNER_TEMP/factorial-package/"*.tgz --engine-strict --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Audit release candidate dependencies
        run: npm audit --prefix "$RUNNER_TEMP/factorial-consumer" --omit=dev --audit-level=low

      - name: Smoke-test release candidate
        run: node scripts/smoke-test.mjs "$RUNNER_TEMP/factorial-consumer/node_modules/@t4dhg/mcp-factorial/dist/index.js"

      # No NODE_AUTH_TOKEN. This authenticates with the OIDC token minted by the
      # id-token permission above, matched against the trusted publisher
      # configured for this package on npmjs.com. Provenance is automatic.
      #
      # `stage publish` uploads the tarball but does NOT make it installable.
      # A human then inspects it and runs `npm stage approve <stage-id>`, which
      # is where 2FA is proved. CI therefore cannot ship a release on its own,
      # so a compromised workflow cannot put a version in front of users.
      # Promoting a staged release is documented in CONTRIBUTING.md.
      - name: Stage the release
        run: npm stage publish --access public
